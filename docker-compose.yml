# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: adams
      POSTGRES_PASSWORD: adams
      POSTGRES_DB: adams_realty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
